[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "0.1.0"
description = "An AST-powered time-travel debugger with SQLite storage and Textual TUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tanmay Dhoot", email = "mylifeastanmay@gmail.com" },
    { name = "Naman Garg", email = "namangarg06@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
pychronicle = "pychronicle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pychronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

