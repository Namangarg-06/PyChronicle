[project]
name = "pychronicle"
version = "0.1.0"
description = "PyChronicle Week 4: packaged CLI tracer with a polished Textual UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.25.0",
    "rich>=13.0",
    "typer>=0.12.0"
]

[project.scripts]
pychronicle = "week4.runner:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
